<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LAN Device Monitor</title>
<link rel="stylesheet" href="/client.css" />
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="status-dot" id="statusDot"></div>
    <h1>Connected</h1>
    <p class="sub">This device is registered with the LAN Device Monitor.</p>
    <div class="grid">
      <div class="item"><span class="label">Device ID</span><span class="value" id="deviceId">-</span></div>
      <div class="item"><span class="label">Connection</span><span class="value" id="connStatus">Connecting...</span></div>
    </div>
  </div>
</div>
<script src="/client.js"></script>
</body>
</html>
